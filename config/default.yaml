# edgelab default configuration.
#
# RULE: decide the `acceptance` numbers BEFORE you look at any results, and do
# not loosen them afterwards. Moving the goalposts after seeing a backtest is
# the most common way to fool yourself.

risk:
  risk_per_trade_pct: 0.5        # % of equity risked if the stop is hit ($2.50 on $500)
  daily_loss_limit_pct: 2.0      # no new entries for the rest of the day after this loss
  max_drawdown_halt_pct: 15.0    # kill switch: flatten and stop trading
  max_leverage: 5.0              # cap on notional / equity. See README: at 1.0 a $500
                                 # account cannot hold even one EURUSD micro lot.
  max_open_positions: 1

# PLACEHOLDER cost assumptions in basis points of price. Replace with numbers
# measured from your broker's demo account (spreads, commissions, slippage).
costs:
  fx:
    spread_bps: 1.0              # ~1 pip on EURUSD
    fee_bps_per_side: 0.0
    slippage_bps_per_side: 0.2
  crypto:
    spread_bps: 2.0
    fee_bps_per_side: 10.0       # 0.1% taker fee, typical for a retail spot account
    slippage_bps_per_side: 2.0

acceptance:
  min_trades: 200                # out-of-sample trades, not in-sample
  min_profit_factor: 1.3         # after costs
  max_drawdown_pct: 15.0
  min_expectancy_r: 0.05         # average result per trade in units of risk (R)
  cost_stress_multiplier: 2.0    # re-run with costs multiplied by this ...
  min_stressed_profit_factor: 1.0  # ... and it must still not lose money
